name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - name: Import check
        run: python -c "from bivia import Bivia, AsyncBivia; print('OK')"
      - name: Type check
        run: |
          pip install pyright
          pyright bivia/ || true
